name: Build and test

on:
  push:
    branches-ignore:
      - "docs-*"
  pull_request:
    branches-ignore:
      - "docs-*"

env:
  PYTHON_VERSION: 3.9

jobs:
  build-and-static-analysis:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Install NODE JS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install project
        run: yarn install

      - name: Install slither
        run: pip3 install -r scripts/requirements.txt

      - name: Show slither version
        run: slither --version

      - name: lint
        run: yarn fullCheck

      - name: Test ABI generation
        run: npx hardhat run scripts/generateAbi.ts

  tests:
    runs-on: ubuntu-latest
    needs: build-and-static-analysis
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Install NODE JS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - name: Install project
        run: yarn install

      - name: Test deployment
        run: ./scripts/test_deploy.sh

      - name: Test upgrade
        env:
          NODE_VERSION: ${{ matrix.node-version }}
        run: ./scripts/test_upgrade.sh

      - name: Test transfer ownership
        run: TEST_MODE=true ./scripts/test_change_ownership.sh

      - name: Run tests
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: yarn test

  coverage:
    name: Coverage (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: build-and-static-analysis

    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: DKG
            files: "test/SkaleDKG.ts"
            tag: dkg
          - name: Schains
            files: "test/Schains.ts"
            tag: schains
          - name: Other Contracts
            files: "test/!(SkaleDKG|Schains).ts"
            tag: others
    env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install NODE JS
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "yarn"

      - name: Install project
        run: yarn install

      - name: Run tests
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: npx hardhat coverage --solcoverjs .solcover.js --testfiles "${{ matrix.shard.files }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          # use tags so that no override occurs - merge
          flags: ${{ matrix.shard.tag }}
          token: ${{ secrets.CODECOV_TOKEN }}
