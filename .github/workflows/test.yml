name: Test

on:
  push:
    branches-ignore:
      - "docs-*"
  pull_request:
    branches-ignore:
      - "docs-*"

env:
  NODE_STABLE_VERSION: 22.x # Support until Apr 2027
  NODE_ACTIVE_VERSION: 24.x # In active LTS until Oct 2026
  PYTHON_VERSION: 3.11

jobs:
  build-and-static-analysis:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Install NODE JS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install project
        run: yarn install

      - name: Install slither
        run: pip3 install -r scripts/requirements.txt

      - name: Show slither version
        run: slither --version

      - name: lint
        run: yarn fullCheck

      - name: Test ABI generation
        run: npx hardhat run scripts/generateAbi.ts

  deployments-and-tests:
    runs-on: ubuntu-latest
    needs: build-and-static-analysis

    steps:
      - uses: actions/checkout@v6

      - name: Install NODE JS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_STABLE_VERSION }}
          cache: "yarn"

      - name: Install project
        run: yarn install

      - name: Test deployment
        run: ./scripts/test_deploy.sh

      - name: Test upgrade
        env:
          NODE_VERSION: ${{ env.NODE_STABLE_VERSION }}
        run: ./scripts/test_upgrade.sh

      - name: Test transfer ownership
        run: TEST_MODE=true ./scripts/test_change_ownership.sh

      - name: Run tests
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: yarn test

  coverage:
    name: Coverage (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: build-and-static-analysis

    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: DKG
            files: "test/SkaleDKG.ts"
          - name: Schains
            files: "test/Schains.ts"
          - name: Others
            files: "test/**/!(SkaleDKG|Schains).ts"
    env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install NODE JS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_ACTIVE_VERSION }}
          cache: "yarn"

      - name: Install project
        run: yarn install

      - name: Run tests
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: npx hardhat coverage --solcoverjs .solcover.js --testfiles "${{ matrix.shard.files }}"

      - name: Prepare Artifact
        run: |
          mv coverage/coverage-final.json coverage-${{ matrix.shard.name }}.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-part-${{ matrix.shard.name }}
          path: coverage-${{ matrix.shard.name }}.json
          retention-days: 1

  upload-coverage:
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_ACTIVE_VERSION }}

      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-part-*
          merge-multiple: true
          path: ./all-reports

      - name: Merge Reports
        run: |
          # Create a temp directory for the output
          mkdir -p coverage

          # Merge all JSONs into one
          npx -y nyc merge ./all-reports coverage/coverage-final.json

          # Clean up old reports
          rm -rf ./all-reports

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          fail_ci_if_error: true
